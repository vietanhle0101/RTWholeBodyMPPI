# High-level contact scheduler.  All dimensions are planar SI units.
scheduler_dt: 0.20
horizon: 5
replan_rate_hz: 5.0
solver_time_limit_s: 5.0

# The current MuJoCo push-box model is 0.38 m square.  Keeping independent
# extents makes the scheduler immediately applicable to a rectangular box.
box_half_length: 0.19
box_half_width: 0.19
box_mass: 3.70
box_yaw_inertia: 0.0849
linear_damping: 7.0
angular_damping: 0.25

# The forward trunk collision bumper reaches approximately 0.276 m ahead of
# the trunk origin.  The MINLP and staging wrapper therefore share a 0.291 m
# root-to-face distance: 1.5 cm clearance beyond that physical bumper.
robot_standoff: 0.291
bumper_forward_offset: 0.276
bumper_clearance: 0.015
robot_speed_max: 0.25
# Approach/alignment are outside the MINLP, but use the same contact geometry.
# Re-select a committed pre-contact face only when it becomes counterproductive
# or another face's goal-direction score wins by this margin.
approach_face_score_margin: 0.10
approach_reselect_cooldown_s: 0.60
align_yaw_tolerance_deg: 12.5
align_creep_speed: 0.05
# Contact lifecycle: after engaging a face, remain in contact mode for at
# least this long. Recover to free approach only after the standoff error has
# exceeded reachable_distance + margin for this many consecutive replans.
contact_min_hold_s: 1.0
contact_release_margin: 0.10
contact_release_replans: 3
# The scheduler runs at 5 Hz, so 1.25 rad/s limits a new orientation command
# to 0.25 rad per replan.  The raw face heading remains available in logs.
reference_yaw_rate_max: 1.25
box_speed_max: 1.0
box_yaw_rate_max: 2.0
force_max: 50.0
contact_tolerance: 0.04
big_m: 10.0

weights:
  box_position: 150.0
  terminal_box_position: 600.0
  box_velocity: 2.0
  box_yaw_rate: 0.5
  robot_velocity: 2.0
  force: 0.002
  contact_switch: 1.0
  # Applied at the boundary between successive receding-horizon solves.
  # Larger than the within-plan value because an abrupt face change forces a
  # large Go1 heading change and is not represented by the planar box model.
  initial_contact_switch: 8.0
