# High-level contact scheduler.  All dimensions are planar SI units.
# Longer lookahead (3.0s vs the base config's 1.0s) via a coarser per-step
# discretization, so a face switch/reposition has time to pay off within the
# horizon instead of always looking locally worse than staying put.
scheduler_dt: 0.50
horizon: 6
replan_rate_hz: 2.0
# The 3x longer horizon roughly doubles the discrete search space (24 vs 20
# binaries); 5s wasn't enough for BONMIN to find any feasible incumbent at
# all here, so it fell back to the crude heuristic on every call. Give it
# more room before judging whether the longer lookahead itself helps.
solver_time_limit_s: 20.0

# The current MuJoCo push-box model is 0.38 m square.  Keeping independent
# extents makes the scheduler immediately applicable to a rectangular box.
box_half_length: 0.19
box_half_width: 0.19
box_mass: 3.70
box_yaw_inertia: 0.0849
linear_damping: 7.0
angular_damping: 0.25

robot_standoff: 0.34
robot_speed_max: 0.25
box_speed_max: 1.0
box_yaw_rate_max: 2.0
force_max: 50.0
contact_tolerance: 0.04
big_m: 10.0

weights:
  box_position: 150.0
  terminal_box_position: 600.0
  box_velocity: 2.0
  box_yaw_rate: 0.5
  robot_velocity: 2.0
  force: 0.002
  contact_switch: 1.0
